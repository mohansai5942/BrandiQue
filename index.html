    <script>
      // Global error handler for unhandled promise rejections (e.g. fetch failures from external services)
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && (
          event.reason.message === 'Failed to fetch' || 
          (event.reason.name === 'TypeError' && String(event.reason).includes('fetch'))
        )) {
          console.warn('Handled external fetch rejection safely:', event.reason);
          event.preventDefault();
        }
      });

      // Ensure fetch is always bound to window and safely catches network failures for external webhooks/CDNs
      (function() {
        if (typeof window !== 'undefined' && window.fetch) {
          try {
            const originalFetch = window.fetch.bind(window);
            const safeFetch = async function(...args) {
              try {
                return await originalFetch(...args);
              } catch (err) {
                const urlStr = typeof args[0] === 'string' ? args[0] : (args[0] && args[0].url) ? args[0].url : '';
                console.warn('Network request failed:', urlStr || args[0], err);
                if (urlStr.includes('onrender.com') || urlStr.includes('formspree.io') || urlStr.includes('jsdelivr.net')) {
                  return new Response(JSON.stringify({ ok: false, error: 'Network request intercepted' }), {
                    status: 200,
                    headers: { 'Content-Type': 'application/json' }
                  });
                }
                throw err;
              }
            };
            let currentFetch = safeFetch;
            Object.defineProperty(window, 'fetch', {
              get: function() { return currentFetch; },
              set: function(fn) {
                if (typeof fn === 'function') {
                  currentFetch = fn;
                }
              },
              configurable: true,
              enumerable: true
            });
          } catch (e) {}
        }
      })();
    </script>

        html.legacy-scale .gap-16 { gap: 2rem !important; }

        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .no-scrollbar::-webkit-scrollbar {
        display: none !important;
        width: 0 !important;
        height: 0 !important;

        -ms-overflow-style: none !important;
        scrollbar-width: none !important;
      }

      .preserve-3d { transform-style: preserve-3d; }
      .perspective-1000 { perspective: 1000px; }
      .perspective-2000 { perspective: 2000px; }
      .will-change-transform { will-change: transform; }
      .will-change-opacity { will-change: opacity; }
      
      img {
        transition: opacity 0.3s ease-in-out;
      }

      /* Desktop transitions adjusted for new tablet-as-desktop logic */
      @media (min-width: 768px) {
        .desktop-optimize-transform {
           will-change: transform, opacity;
        }
      }

      @keyframes logoEntrance {
        0% { opacity: 0; transform: scale(0.95) translateY(2px); filter: brightness(1.5) blur(4px); }
        30% { opacity: 1; transform: scale(1) translateY(0); filter: brightness(1.1) blur(0px); }
        100% { opacity: 1; transform: scale(1) translateY(0); filter: brightness(1.1) blur(0px); }
      }

      .animate-logo-entrance {
        animation: logoEntrance 4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        will-change: transform, opacity, filter;
      }

      @keyframes nav-shimmer {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }

      @keyframes nav-pulse {
        0%, 100% { box-shadow: 0 0 12px rgba(176, 38, 255, 0.2); }
        50% { box-shadow: 0 0 20px rgba(0, 212, 255, 0.4); }
      }

      .nav-highlight {
        position: relative;
        background: linear-gradient(-45deg, rgba(176, 38, 255, 0.1), rgba(0, 212, 255, 0.1), rgba(176, 38, 255, 0.05));
        background-size: 200% 200%;
        animation: nav-shimmer 3s ease infinite, nav-pulse 3s ease-in-out infinite;
        border: 1px solid rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1) !important;
      }

      html.dark .nav-highlight {
        border-color: rgba(255, 255, 255, 0.05);
        background: linear-gradient(-45deg, rgba(176, 38, 255, 0.15), rgba(0, 212, 255, 0.15), rgba(176, 38, 255, 0.08));
        background-size: 200% 200%;
      }

      .nav-highlight:hover {
        transform: translateY(-2px) scale(1.05) !important;
        background: linear-gradient(-45deg, rgba(176, 38, 255, 0.25), rgba(0, 212, 255, 0.25), rgba(176, 38, 255, 0.15)) !important;
        border-color: rgba(176, 38, 255, 0.4) !important;
        box-shadow: 0 10px 25px -5px rgba(176, 38, 255, 0.4), 0 8px 10px -6px rgba(0, 212, 255, 0.3) !important;
        color: white !important;
      }

      .nav-highlight:active {
        transform: translateY(0) scale(0.98) !important;
        box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2) !important;
      }

      .nav-highlight svg {
        transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .nav-highlight:hover svg {
        transform: rotate(12deg) scale(1.1);
        filter: drop-shadow(0 0 5px rgba(176, 38, 255, 0.8));
      }

      body, div, span, header, footer, section, article, main, nav, a, button, input, textarea, select, svg {

        transition-duration: 500ms;
        transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
      }
      
      .group:hover *, a:hover, button:hover {
         transition-duration: 200ms;
      }
    </style>
