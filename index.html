<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--seo-head-->
    <meta name="google-site-verification" content="yabpCgv5BOpOpfkzwsekwwHq1DGyhdGIsjG_UHh5Wb4" />
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/brand/favicon-192.png" />
    <link rel="apple-touch-icon" href="/assets/brand/favicon-192.png" />
    
    <link rel="dns-prefetch" href="https://images.unsplash.com">
    
    <script>
      if (localStorage.getItem('theme') !== 'light') {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    </script>
    <style>
      body {
        font-family: 'Inter', sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }

      /* Consistent sizing on every screen. Phones and tablets use a fixed comfortable size;
         laptops and desktops scale fluidly against a 1440px design, so a laptop running Windows
         display scaling (125% / 150%) shows the same layout instead of a zoomed-in one. */
      .scrollbar-none { scrollbar-width: none; } .scrollbar-none::-webkit-scrollbar { display: none; }
      html { font-size: 16px; }
      @media (max-width: 767px) { html { font-size: 13px; } }
      @media (min-width: 768px) and (max-width: 1023px) { html { font-size: 12px; } }
      @media (min-width: 1024px) { html { font-size: clamp(11.5px, calc(100vw / 1440 * 14.4), 16.2px); } }

      html.dark body {
        background: #05070A;
        color: #ffffff;
      }
      
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      html.dark ::-webkit-scrollbar-track {
        background: #0A0C11;
      }
      ::-webkit-scrollbar-thumb {
        background: #c1c1c1;
        border-radius: 4px;
      }
      html.dark ::-webkit-scrollbar-thumb {
        background: #2a2d3d;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #a8a8a8;
      }
      html.dark ::-webkit-scrollbar-thumb:hover {
        background: #4B5563;
      }

      .glass-morphism {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }

      .text-gradient {
        background: linear-gradient(to right, #B026FF, #00D4FF);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .no-scrollbar::-webkit-scrollbar {
        display: none !important;
        width: 0 !important;
        height: 0 !important;
      }
      .no-scrollbar {
        -ms-overflow-style: none !important;
        scrollbar-width: none !important;
      }

      .preserve-3d { transform-style: preserve-3d; }
      .perspective-1000 { perspective: 1000px; }
      .perspective-2000 { perspective: 2000px; }
      .will-change-transform { will-change: transform; }
      .will-change-opacity { will-change: opacity; }
      
      img {
        transition: opacity 0.3s ease-in-out;
      }

      /* Desktop transitions adjusted for new tablet-as-desktop logic */
      @media (min-width: 768px) {
        .desktop-optimize-transform {
           will-change: transform, opacity;
        }
      }

      @keyframes logoEntrance {
        0% { opacity: 0; transform: scale(0.95) translateY(2px); filter: brightness(1.5) blur(4px); }
        30% { opacity: 1; transform: scale(1) translateY(0); filter: brightness(1.1) blur(0px); }
        100% { opacity: 1; transform: scale(1) translateY(0); filter: brightness(1.1) blur(0px); }
      }

      .animate-logo-entrance {
        animation: logoEntrance 4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        will-change: transform, opacity, filter;
      }

      @keyframes nav-shimmer {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }

      @keyframes nav-pulse {
        0%, 100% { box-shadow: 0 0 12px rgba(234, 179, 8, 0.2); }
        50% { box-shadow: 0 0 20px rgba(0, 212, 255, 0.4); }
      }

      .nav-highlight {
        position: relative;
        background: linear-gradient(-45deg, rgba(234, 179, 8, 0.1), rgba(0, 212, 255, 0.1), rgba(234, 179, 8, 0.05));
        background-size: 200% 200%;
        animation: nav-shimmer 3s ease infinite, nav-pulse 3s ease-in-out infinite;
        border: 1px solid rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1) !important;
      }

      html.dark .nav-highlight {
        border-color: rgba(255, 255, 255, 0.05);
        background: linear-gradient(-45deg, rgba(234, 179, 8, 0.15), rgba(0, 212, 255, 0.15), rgba(234, 179, 8, 0.08));
        background-size: 200% 200%;
      }

      .nav-highlight:hover {
        transform: translateY(-2px) scale(1.05) !important;
        background: linear-gradient(-45deg, rgba(234, 179, 8, 0.25), rgba(0, 212, 255, 0.25), rgba(234, 179, 8, 0.15)) !important;
        border-color: rgba(234, 179, 8, 0.4) !important;
        box-shadow: 0 10px 25px -5px rgba(234, 179, 8, 0.4), 0 8px 10px -6px rgba(0, 212, 255, 0.3) !important;
        color: white !important;
      }

      .nav-highlight:active {
        transform: translateY(0) scale(0.98) !important;
        box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2) !important;
      }

      .nav-highlight svg {
        transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .nav-highlight:hover svg {
        transform: rotate(12deg) scale(1.1);
        filter: drop-shadow(0 0 5px rgba(234, 179, 8, 0.8));
      }

      body, div, span, header, footer, section, article, main, nav, a, button, input, textarea, select, svg {
        transition-property: background-color, color, border-color, fill, stroke, shadow;
        transition-duration: 500ms;
        transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
      }
      
      .group:hover *, a:hover, button:hover {
         transition-duration: 200ms;
      }
    </style>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/index.tsx"></script>
    <style>
      /* AI Focus Mode Overrides */
      div#root:nth-of-type(1) > div:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1) > div:nth-of-type(1) > section:nth-of-type(1) {
      }
      div#root:nth-of-type(1) > div:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1) > div:nth-of-type(1) > section:nth-of-type(1) > div:nth-of-type(1) > div:nth-of-type(1) > div:nth-of-type(1) {
      }
      div#root:nth-of-type(1) > div:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1) > div:nth-of-type(1) > section:nth-of-type(1) > div:nth-of-type(1) > div:nth-of-type(2) > div:nth-of-type(1) {
      }
      div#root:nth-of-type(1) > div:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1) > div:nth-of-type(1) > section:nth-of-type(1) > div:nth-of-type(1) > div:nth-of-type(3) > div:nth-of-type(1) {
      }
      div#root:nth-of-type(1) > div:nth-of-type(1) > main:nth-of-type(1) > div:nth-of-type(1) > section:nth-of-type(12) > div:nth-of-type(1) > div:nth-of-type(1) {
        margin-bottom: 0px !important;
        padding-left: 0px !important;
      }
    </style>

  </body>
</html>
