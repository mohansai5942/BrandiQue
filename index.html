    <style>
      :root {
        /* Colors */
        --chat--color--primary: #B026FF;
        --chat--color--secondary: #00D4FF;
        --chat--color-dark: #E5E7EB;
        --chat--color-light: rgba(17, 20, 26, 0.8);
        --chat--color-white: #11141A;
        
        /* Typography */
        --chat--font-family: "Inter", system-ui, -apple-system, sans-serif;
        --chat--message--font-size: 0.875rem; /* 14px */
        --chat--subtitle--font-size: 0.7rem;
        --chat--heading--font-size: 0.95rem;
        --chat--input--font-size: 0.875rem;
        
        /* Layout */
        --chat--border-radius: 16px;
        --chat--window--border: 1px solid rgba(255, 255, 255, 0.08);
        --chat--window--border-radius: 20px;
        --chat--toggle--size: 56px;
        --chat--spacing: 1.5rem;
        --chat--window--right: 1.5rem;
        --chat--window--bottom: 1.5rem;
        
        /* Messages */
        --chat--message--bot--background: #1D222E;
        --chat--message--bot--color: #E5E7EB;
        --chat--message--bot--border: 1px solid rgba(255, 255, 255, 0.05);
        --chat--message--user--background: linear-gradient(135deg, #00D4FF, #B026FF);
        --chat--message--user--color: #FFFFFF;
        
        /* Input & Header */
        --chat--input--background: #11141A;
        --chat--input--text-color: #FFFFFF;

        --chat--header--background: rgba(17, 20, 26, 0.5);

      @media (max-width: 1024px) {

          --chat--window--max-height: calc(100dvh - 5.5rem);

          --chat--window--bottom: 1rem;

        .chat-layout .chat-header {
          padding: 0.875rem 1rem !important;
        }

        .chat-layout .chat-footer {
          padding: 0.5rem 0.875rem !important;
        }
        
        .chat-layout .chat-header h1 {

        .chat-inputs textarea {

          font-size: 0.95rem !important;

          line-height: 22px !important;

      .chat-window {
        backdrop-filter: blur(24px);

        box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.05) !important;
        background: rgba(17, 20, 26, 0.7) !important;
        border: none !important;
      }

      /* Header */
      .chat-layout .chat-header {
        border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important;
        padding: 1.25rem 1.5rem !important;
      }
      
      .chat-layout .chat-header h1 {
        font-weight: 600 !important;
        letter-spacing: 0.02em;
        font-size: 23px !important;
