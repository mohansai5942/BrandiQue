    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }

      /* MOBILE SPECIFIC SIZE REDUCTION (Under 768px) */
      @media (max-width: 767px) {
        html {
          font-size: 11px; /* Global scale-down of all rem units */
        }
        
        /* Reduce Massive Headings in Hero */
        .text-4xl { font-size: 2.5rem !important; }
        .text-5xl { font-size: 3rem !important; }
        
        /* Reduce General Section Spacing on Mobile */
        section { 
          padding-top: 2rem !important; 
          padding-bottom: 2rem !important; 
        }
        
        /* Specific override for hero to maintain some stature but more compact */
        section.pt-24 { 
          padding-top: 6rem !important; 
          padding-bottom: 3rem !important;
          min-height: auto !important;
        }

        /* Shrink Margin/Gaps */
        .mb-16 { margin-bottom: 2rem !important; }
        .mb-24 { margin-bottom: 3rem !important; }
        .gap-12 { gap: 1.5rem !important; }
        .gap-16 { gap: 2rem !important; }
      }

      /* TABLET/SMALL DESKTOP RANGE (768px to 1200px) */
      @media (min-width: 768px) and (max-width: 1200px) {
        html {
          font-size: 13px; 
        }
        .text-8xl { font-size: 4rem !important; line-height: 1.1 !important; }
        .text-7xl { font-size: 3.5rem !important; }
        .text-6xl { font-size: 3rem !important; }
        .text-5xl { font-size: 2.5rem !important; }
        section { padding-top: 4rem !important; padding-bottom: 4rem !important; }
      }
      
      html.dark body {
        background: #05070A;
        color: #ffffff;
      }
      
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      html.dark ::-webkit-scrollbar-track {
        background: #0A0C11;
      }
      ::-webkit-scrollbar-thumb {
        background: #c1c1c1;
        border-radius: 4px;
      }
      html.dark ::-webkit-scrollbar-thumb {
        background: #2a2d3d;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #a8a8a8;
      }
      html.dark ::-webkit-scrollbar-thumb:hover {
        background: #4B5563;
      }

      .glass-morphism {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }

      .text-gradient {
        background: linear-gradient(to right, #B026FF, #00D4FF);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .preserve-3d { transform-style: preserve-3d; }
      .perspective-1000 { perspective: 1000px; }
      .perspective-2000 { perspective: 2000px; }
      .will-change-transform { will-change: transform; }
      .will-change-opacity { will-change: opacity; }
      
      img {
        transition: opacity 0.3s ease-in-out;
      }

      /* Desktop transitions adjusted for new tablet-as-desktop logic */
      @media (min-width: 768px) {
        .desktop-optimize-transform {
           will-change: transform, opacity;
        }
      }

      @keyframes logoEntrance {
        0% { opacity: 0; transform: scale(0.95) translateY(2px); filter: brightness(1.5) blur(4px); }
        30% { opacity: 1; transform: scale(1) translateY(0); filter: brightness(1.1) blur(0px); }
        100% { opacity: 1; transform: scale(1) translateY(0); filter: brightness(1.1) blur(0px); }
      }

      .animate-logo-entrance {
        animation: logoEntrance 4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        will-change: transform, opacity, filter;
      }

      body, div, span, header, footer, section, article, main, nav, a, button, input, textarea, select, svg {
        transition-property: background-color, color, border-color, fill, stroke, shadow;
        transition-duration: 500ms;
        transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
      }
      
      .group:hover *, a:hover, button:hover {
         transition-duration: 200ms;
      }
    </style>
